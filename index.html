<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🏃 老板哪里跑 - 平台版</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; touch-action: none; user-select: none; }
        body { font-family: 'Microsoft YaHei', sans-serif; }
        
        #gameContainer { position: relative; width: 100%; height: 100%; overflow: hidden; }
        
        .topBar {
            position: absolute; top: 0; left: 0; right: 0; height: 40px;
            background: rgba(0,0,0,0.92); display: flex; justify-content: space-around; align-items: center;
            padding: 0 3px; z-index: 100;
        }
        .stat { text-align: center; }
        .stat-label { font-size: 6px; color: #888; }
        .stat-value { font-size: 12px; font-weight: bold; color: #fff; }
        .stat-value.score { color: #ffd93d; }
        .stat-value.combo { color: #e94560; }
        .stat-value.lives { color: #ff6b6b; }
        .stat-value.level { color: #4ecca3; }
        
        #gameCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        
        .missionTip {
            position: absolute; top: 46px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.8); padding: 3px 8px; border-radius: 8px;
            color: #fff; font-size: 8px; z-index: 100; white-space: nowrap;
        }
        .missionTip .task { color: #ffd93d; }
        
        .itemBar {
            position: absolute; top: 43px; right: 5px;
            display: flex; flex-direction: column; gap: 2px; z-index: 100;
        }
        .itemSlot {
            width: 28px; height: 28px;
            background: rgba(0,0,0,0.7); border: 2px solid #444;
            border-radius: 4px; display: flex; justify-content: center; align-items: center;
            font-size: 15px; cursor: pointer;
        }
        .itemSlot.active { border-color: #ffd93d; background: rgba(255,217,61,0.2); }
        
        #joystickArea {
            position: absolute; bottom: 110px; left: 12px; width: 95px; height: 95px;
            background: rgba(255,255,255,0.1); border-radius: 50%; border: 3px solid rgba(255,255,255,0.2);
            z-index: 100;
        }
        #joystick {
            position: absolute; width: 38px; height: 38px;
            background: rgba(233,69,96,0.8); border-radius: 50%;
            top: 50%; left: 50%; transform: translate(-50%, -50%);
        }
        
        .actionBtns {
            position: absolute; bottom: 12px; right: 12px;
            display: grid; grid-template-columns: repeat(2, 45px); gap: 5px;
            z-index: 100;
        }
        .actionBtn {
            width: 45px; height: 45px; border-radius: 50%;
            background: rgba(233,69,96,0.8); border: 2px solid #fff;
            color: #fff; font-size: 16px; display: flex; justify-content: center; align-items: center;
        }
        .actionBtn:active { transform: scale(0.9); background: #e94560; }
        .actionBtn.skill { background: rgba(78,204,163,0.8); border-color: #4ecca3; }
        
        .energyBar {
            position: absolute; bottom: 110px; right: 16px; width: 14px; height: 95px;
            background: rgba(0,0,0,0.6); border: 2px solid #444; border-radius: 7px;
            overflow: hidden; z-index: 100;
        }
        #energyFill { position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(0deg, #4ecca3, #ffd93d); }
        .energyLabel { position: absolute; bottom: 110px; right: 34px; color: #fff; font-size: 6px; z-index: 100; }
        
        #startScreen {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 500; overflow-y: auto; padding: 12px;
        }
        #startScreen h1 { font-size: 22px; color: #e94560; margin-bottom: 2px; text-shadow: 0 0 12px rgba(233,69,96,0.5); }
        #startScreen .subtitle { color: #4ecca3; margin-bottom: 8px; font-size: 9px; }
        .character-preview { font-size: 50px; margin-bottom: 8px; animation: bounce 1s infinite; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
        #startScreen .intro { color: #aaa; font-size: 9px; text-align: center; line-height: 1.5; margin-bottom: 8px; max-width: 220px; }
        
        .levelSelector { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; margin: 6px; max-width: 240px; }
        .levelBtn {
            width: 42px; height: 42px;
            background: rgba(255,255,255,0.1); border: 2px solid #444;
            border-radius: 6px; color: #fff; font-size: 8px;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            cursor: pointer;
        }
        .levelBtn.unlocked { border-color: #4ecca3; background: rgba(78,204,163,0.2); }
        .levelBtn.current { background: rgba(233,69,96,0.3); border-color: #e94560; }
        .levelBtn.locked { opacity: 0.4; }
        .levelBtn.boss { background: rgba(233,69,96,0.3); border-color: #e94560; }
        .levelBtn .level-num { font-size: 13px; font-weight: bold; }
        
        .menuBtn {
            background: linear-gradient(135deg, #e94560, #ff6b6b);
            border: none; color: #fff; padding: 8px 28px; font-size: 12px;
            border-radius: 18px; cursor: pointer; margin: 4px; font-family: inherit;
            box-shadow: 0 3px 8px rgba(233,69,96,0.4);
        }
        .menuBtn:active { transform: scale(0.95); }
        .menuBtn.secondary { background: rgba(255,255,255,0.1); border: 2px solid #444; box-shadow: none; font-size: 10px; padding: 6px 18px; }
        
        #endScreen {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.95); display: none; flex-direction: column;
            justify-content: center; align-items: center; z-index: 500;
        }
        #endScreen.show { display: flex; }
        #endScreen h2 { font-size: 20px; margin-bottom: 8px; }
        #endScreen.win h2 { color: #4ecca3; }
        #endScreen.lose h2 { color: #e94560; }
        #endScreen .story { color: #aaa; font-size: 10px; text-align: center; max-width: 220px; line-height: 1.5; margin-bottom: 8px; padding: 0 12px; }
        #endScreen .stats { color: #ffd93d; font-size: 12px; margin-bottom: 5px; }
        .stars { font-size: 22px; margin: 5px 0; }
        
        .scorePopup { position: absolute; font-size: 16px; font-weight: bold; color: #ffd93d; text-shadow: 0 0 5px #ffd93d; animation: floatUp 0.5s ease-out forwards; pointer-events: none; z-index: 200; }
        @keyframes floatUp { 0% { transform: translateY(0) scale(1); opacity: 1; } 100% { transform: translateY(-25px) scale(1.1); opacity: 0; } }
        
        .comboPopup { position: absolute; font-size: 20px; font-weight: bold; color: #e94560; text-shadow: 0 0 8px #e94560; animation: comboAnim 0.25s ease-out forwards; pointer-events: none; z-index: 200; }
        @keyframes comboAnim { 0% { transform: scale(0.5); opacity: 0; } 50% { transform: scale(1.2); opacity: 1; } 100% { transform: scale(1); opacity: 0; } }
        
        .effectHint {
            position: absolute; top: 68px; left: 50%; transform: translateX(-50%);
            background: linear-gradient(135deg, #4ecca3, #38b2ac);
            padding: 4px 10px; border-radius: 10px;
            color: #fff; font-size: 10px; font-weight: bold;
            animation: pulse 0.25s ease-out; z-index: 150;
        }
        @keyframes pulse { 0% { transform: translateX(-50%) scale(0.8); opacity: 0; } 50% { transform: translateX(-50%) scale(1.05); } 100% { transform: translateX(-50%) scale(1); opacity: 1; } }
        
        #pauseBtn {
            position: absolute; top: 43px; left: 5px;
            background: rgba(0,0,0,0.6); border: 2px solid #fff;
            color: #fff; width: 28px; height: 28px; border-radius: 50%;
            font-size: 13px; cursor: pointer; z-index: 100;
        }
        
        .adBtn {
            background: linear-gradient(135deg, #ffd93d, #ff8c00);
            border: none; color: #333; padding: 6px 15px;
            font-size: 10px; border-radius: 10px; cursor: pointer;
            margin: 4px; font-family: inherit; font-weight: bold;
        }
        
        .tutorial {
            position: absolute; bottom: 165px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.8); padding: 4px 8px; border-radius: 4px;
            color: #fff; font-size: 8px; z-index: 100; text-align: center;
            animation: fadeInOut 3s ease-in-out infinite;
        }
        @keyframes fadeInOut { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
        
        #pauseScreen { display:none; position:absolute; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.9); z-index:400; flex-direction:column; justify-content:center; align-items:center; }
    </style>
</head>

            <div class="levelSelector" id="levelSelector"></div>
            <button class="menuBtn" id="startBtn">🎮 开始游戏</button>
            <button class="menuBtn secondary" id="resetBtn">🔄 重置</button>

        <div id="endScreen">

        <div id="pauseScreen">

            shield:  {e:'🛡️',n:'护盾',f:'shield',d:5000},
            magnet:  {e:'🧲',n:'磁铁',f:'magnet',d:4000},
            key:     {e:'🔑',n:'钥匙',f:'key',d:0},
        };
        
        // ==================== 游戏状态 ====================
        let game = {
            state:'menu', currentLevel:1, score:0, maxCombo:0, combo:0, comboTimer:null,
            lives:3, energy:0, timeLeft:60, timeTimer:null,
            player:null, enemies:[], platforms:[], items:[], drops:[],
            unlocks:[1], stars:0, hasKey:false, exitPos:null, cameraY:0,
            activeEffects:{speed:0,invincible:0,shield:0,magnet:0},
            inventory:[null,null,null], bossPhase:1, currentTheme:null,
        };
        
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let W, H;
        
        function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
        resize();
        window.addEventListener('resize', resize);
        
        // ==================== 平台类 ====================
        class Platform {
            constructor(cfg, idx) {
                this.x = cfg.x * W;
                this.y = cfg.y * H;
                this.width = cfg.w * W;
                this.height = 14;
                this.idx = idx;
            }
            
            draw(theme) {
                const sy = this.y - game.cameraY;
                if (sy > H + 30 || sy < -30) return;
                
                const t = theme.platform;
                
                // 主体
                ctx.fillStyle = t.main;
                ctx.fillRect(this.x, sy, this.width, this.height);
                
                // 顶部高光
                ctx.fillStyle = t.top;
                ctx.fillRect(this.x, sy, this.width, 3);
                
                // 纹理
                ctx.fillStyle = t.pattern;
                for (let i = 0; i < this.width; i += 25) {
                    ctx.fillRect(this.x + i, sy + 5, 18, 2);
                }
                
                // 边缘装饰
                ctx.fillStyle = t.top;
                ctx.fillRect(this.x, sy, 3, this.height);
                ctx.fillRect(this.x + this.width - 3, sy, 3, this.height);
            }
            
            getScreenY() { return this.y - game.cameraY; }
        }
        
        // ==================== 传送门类 ====================
        class Portal {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.active = false;
                this.particles = [];
                this.rings = [];
            }
            
            activate() {
                this.active = true;
                // 初始化光环
                for (let i = 0; i < 3; i++) {
                    this.rings.push({ r: 20 + i * 15, alpha: 1 - i * 0.3 });
                }
            }
            
            draw() {
                if (!this.active) return;
                
                const sy = this.y - game.cameraY;
                if (sy > H + 80 || sy < -80) return;
                
                const time = Date.now() / 1000;
                const theme = game.currentTheme;
                const accent = theme ? theme.accent : '#4ecca3';
                
                ctx.save();
                ctx.translate(this.x, sy);
                
                // 外圈旋转光环
                for (let i = 0; i < 8; i++) {
                    const angle = time * 2 + (i / 8) * Math.PI * 2;
                    const dist = 45;
                    ctx.beginPath();
                    ctx.arc(Math.cos(angle) * dist, Math.sin(angle) * dist, 6, 0, Math.PI * 2);
                    ctx.fillStyle = accent;
                    ctx.globalAlpha = 0.7;
                    ctx.fill();
                }
                
                // 旋转光环环
                for (let i = 0; i < 3; i++) {
                    ctx.beginPath();
                    ctx.arc(0, 0, 25 + i * 12, 0, Math.PI * 2);
                    ctx.strokeStyle = accent;
                    ctx.lineWidth = 3;
                    ctx.globalAlpha = (0.8 - i * 0.2) * (0.5 + Math.sin(time * 3 + i) * 0.5);
                    ctx.setLineDash([10, 5]);
                    ctx.lineDashOffset = time * 30 * (i % 2 === 0 ? 1 : -1);
                    ctx.stroke();
                }
                ctx.setLineDash([]);
                
                // 内部能量漩涡
                for (let i = 0; i < 12; i++) {
                    const angle = -time * 3 + (i / 12) * Math.PI * 2;
                    const dist = 15 + Math.sin(time * 4 + i) * 5;
                    ctx.beginPath();
                    ctx.arc(Math.cos(angle) * dist, Math.sin(angle) * dist, 3, 0, Math.PI * 2);
                    ctx.fillStyle = i % 2 === 0 ? accent : '#fff';
                    ctx.globalAlpha = 0.9;
                    ctx.fill();
                }
                
                // 中心核心
                const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, 20);
                gradient.addColorStop(0, '#fff');
                gradient.addColorStop(0.3, accent);
                gradient.addColorStop(1, 'transparent');
                ctx.beginPath();
                ctx.arc(0, 0, 20, 0, Math.PI * 2);
                ctx.fillStyle = gradient;
                ctx.globalAlpha = 0.8 + Math.sin(time * 5) * 0.2;
                ctx.fill();
                
                // 光芒
                ctx.beginPath();
                for (let i = 0; i < 4; i++) {
                    const angle = time + (i / 4) * Math.PI * 2;
                    ctx.moveTo(0, 0);
                    ctx.lineTo(Math.cos(angle) * 55, Math.sin(angle) * 55);
                }
                ctx.strokeStyle = accent;
                ctx.lineWidth = 2;
                ctx.globalAlpha = 0.4;
                ctx.stroke();
                
                // 顶部图标
                ctx.font = '24px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.globalAlpha = 1;
                ctx.fillText('🌀', 0, 0);
                
                ctx.restore();
                
                // 底部光芒
                const glowY = sy + 35;
                const glowGradient = ctx.createRadialGradient(this.x, glowY, 0, this.x, glowY, 60);
                glowGradient.addColorStop(0, accent + '60');
                glowGradient.addColorStop(1, 'transparent');
                ctx.fillStyle = glowGradient;
                ctx.fillRect(this.x - 60, glowY - 10, 120, 30);
            }
        }
        
        // ==================== 玩家 ====================
        class Player {
            spawn() {
                // 找到最近的平台放置
                if (game.platforms.length > 0) {
                    const plat = game.platforms[0]; // 第一层平台
                    this.currentPlatform = plat;
                    this.x = plat.x + plat.width * 0.3; // 左侧
                    this.y = plat.y - this.height; // 站在平台上
                    this.velY = 0;
                    this.onGround = true;
                } else {
                    this.x = 60;
                    this.y = H * 0.8;
                }
                this.width = 32;
                this.height = 48;
                this.velX = 0;
                this.velY = 0;
                this.onGround = true;
                this.sliding = false;
                this.invincible = false;
                this.attacking = false;
                this.skinEmoji = '🏃';
            }
            
            update() {
                // 如果还没有平台，等待
                if (game.platforms.length === 0) return;
                let speed = CONFIG.MOVE_SPEED;
                if (game.activeEffects.speed > 0) speed *= 1.8;
                
                this.velX *= 0.85;
                this.x += this.velX;
                
                this.velY += CONFIG.GRAVITY;
                if (this.velY > CONFIG.FALL_SPEED) this.velY = CONFIG.FALL_SPEED;
                this.y += this.velY;
                
                // 平台碰撞检测
                this.onGround = false;
                this.currentPlatform = null;
                
                const playerLeft = this.x;
                const playerRight = this.x + this.width;
                const playerBottom = this.y + this.height;
                
                for (const plat of game.platforms) {
                    // 检查玩家是否在平台上方的合理范围内
                    const onPlatformX = playerRight > plat.x && playerLeft < plat.x + plat.width;
                    const nearPlatformY = this.y + this.height >= plat.y - 10 && this.y + this.height <= plat.y + 30;
                    
                    if (onPlatformX && nearPlatformY && this.velY >= 0) {
                        this.y = plat.y - this.height;
                        this.velY = 0;
                        this.onGround = true;
                        this.currentPlatform = plat;
                        break;
                    }
                }
                
                // 如果没有碰到任何平台，且玩家掉出屏幕底部，游戏结束
                if (this.y > H + 100) {
                    if (!this.invincible) {
                        this.invincible = true;
                        game.lives--;
                        if (game.lives <= 0) {
                            levelLose();
                        }
                        // 重生到第一个平台
                        setTimeout(() => {
                            if (game.state === 'playing' && game.platforms.length > 0) {
                                const plat = game.platforms[0];
                                this.x = plat.x + plat.width / 2;
                                this.y = plat.y - this.height - 50;
                                this.velY = 0;
                                this.invincible = true;
                                setTimeout(() => { this.invincible = false; }, 2000);
                            }
                        }, 500);
                    }
                }
                
                if (this.x < 0) this.x = 0;
                if (this.x > W - this.width) this.x = W - this.width;
                
                this.height = this.sliding ? 22 : 48;
                
                // 相机跟随
                const targetY = Math.max(0, this.y - H * 0.4);
                game.cameraY += (targetY - game.cameraY) * 0.1;
            }
            
            draw() {
                const sy = this.y - game.cameraY;
                
                ctx.save();
                
                // 护盾
                if (game.activeEffects.shield > 0) {
                    ctx.beginPath();
                    ctx.arc(this.x + this.width/2, sy + this.height/2, 32, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(78,204,163,0.25)';
                    ctx.fill();
                    ctx.strokeStyle = '#4ecca3';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                }
                
                // 无敌闪烁
                if (game.activeEffects.invincible > 0 && Math.floor(Date.now() / 60) % 2 === 0) {
                    ctx.globalAlpha = 0.5;
                }
                
                // 阴影
                if (this.onGround) {
                    ctx.fillStyle = 'rgba(0,0,0,0.3)';
                    ctx.beginPath();
                    ctx.ellipse(this.x + this.width/2, sy + this.height + 2, 14, 4, 0, 0, Math.PI * 2);
                    ctx.fill();
                }
                
                ctx.font = this.height + 'px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'bottom';
                ctx.fillText(this.skinEmoji, this.x + this.width/2, sy + this.height);
                
                // 攻击特效
                if (this.attacking) {
                    ctx.font = '25px Arial';
                    ctx.fillText('💥', this.x + this.width + 8, sy + this.height/2);
                }
                
                ctx.restore();
            }
            
            jump() {
                if (this.onGround && !this.sliding) {
                    this.velY = CONFIG.JUMP_FORCE;
                    this.onGround = false;
                }
            }
            
            dropDown() {
                if (this.currentPlatform && this.velY >= 0) {
                    this.currentPlatform = null;
                    this.onGround = false;
                    this.velY = 2;
                }
            }
            
            slide() {
                if (this.onGround) {
                    this.sliding = true;
                    this.velX = CONFIG.MOVE_SPEED * 1.5 * (this.velX >= 0 ? 1 : -1);
                    setTimeout(() => { this.sliding = false; }, 280);
                }
            }
            
            attack() {
                this.attacking = true;
                setTimeout(() => { this.attacking = false; }, 100);
                
                game.enemies.forEach(e => {
                    if (!e.dead && Math.abs(e.x - this.x) < 55 && Math.abs(e.y - this.y) < 40) {
                        e.takeDamage(1);
                    }
                });
                
                game.items.forEach(item => {
                    if (!item.collected && Math.abs(item.x - this.x) < 45 && Math.abs(item.y - this.y) < 35) {
                        item.collect();
                    }
                });
            }
            
            hit() {
                if (this.invincible || game.activeEffects.invincible > 0 || game.activeEffects.shield > 0) return;
                
                game.lives--;
                game.combo = 0;
                this.invincible = true;
                
                showEffectHint('💥 受伤!');
                canvas.style.animation = 'none';
                canvas.offsetHeight;
                canvas.style.animation = 'shake 0.2s';
                
                setTimeout(() => { this.invincible = false; }, 1500);
                
                if (game.lives <= 0) levelLose();
                updateUI();
            }
            
            useItem(slot) {
                const item = game.inventory[slot];
                if (!item) return;
                
                const cfg = ITEM_CFG[item];
                game.inventory[slot] = null;
                updateItemBar();
                
                if (cfg.f === 'key') {
                    game.hasKey = true;
                    showEffectHint('🔑 获得钥匙!');
                    if (game.exitPortal) game.exitPortal.activate();
                } else {
                    showEffectHint(cfg.e + ' ' + cfg.n + '!');
                    game.activeEffects[cfg.f] = cfg.d;
                }
            }
        }
        
        // ==================== 敌人 ====================
        class Enemy {
            constructor(cfg) {
                const c = ENEMY_CFG[cfg.type];
                this.type = cfg.type;
                this.emoji = c.e;
                this.speed = c.s;
                this.name = c.n;
                this.color = c.c;
                this.maxHp = c.hp;
                this.hp = c.hp;
                this.pts = c.pts;
                this.boss = c.b || false;
                this.isBoss = cfg.b || false;
                this.platIdx = cfg.p;
                this.currentPlatform = null;
                this.x = 0;
                this.y = 0;
                this.dead = false;
                this.stunned = 0;
                this.slipping = false;
                this.slipDir = 1;
                this.dir = 1;
            }
            
            spawn() {
                const plat = game.platforms[this.platIdx];
                if (!plat) return;
                
                this.currentPlatform = plat;
                this.x = plat.x + plat.width * 0.5;
                this.y = plat.y - 42;
                this.dead = false;
                this.hp = this.maxHp;
            }
            
            update() {
                if (this.dead || !this.currentPlatform) return;
                
                if (this.stunned > 0) { this.stunned -= 16; return; }
                
                if (this.slipping) {
                    this.x += this.slipDir * 10;
                    this.stunned -= 16;
                    if (this.stunned <= 0) this.slipping = false;
                    this.checkPlatform();
                    return;
                }
                
                const plat = this.currentPlatform;
                const p = game.player;
                
                // Boss行为
                if (this.isBoss) {
                    const dx = p.x - this.x;
                    this.dir = dx > 0 ? 1 : -1;
                    let spd = this.speed * (game.bossPhase === 2 ? 1.2 : game.bossPhase === 3 ? 1.5 : 0.8);
                    
                    if (this.currentPlatform === p.currentPlatform || Math.abs(dx) < 100) {
                        this.x += this.dir * spd;
                    }
                } else {
                    this.x += this.dir * this.speed;
                }
                
                // 边界
                if (this.x < plat.x + 12) { this.x = plat.x + 12; this.dir = 1; }
                if (this.x > plat.x + plat.width - 12) { this.x = plat.x + plat.width - 12; this.dir = -1; }
                
                // 碰撞
                if (Math.abs(this.x - p.x) < 28 && Math.abs(this.y - p.y) < 42) {
                    if (p.sliding) p.attack();
                    else p.hit();
                }
            }
            
            checkPlatform() {
                // 掉落检测 - 找到下方的平台
                for (const plat of game.platforms) {
                    if (this.y + 42 >= plat.y - 5 && this.y + 42 <= plat.y + 20) {
                        if (this.x >= plat.x && this.x <= plat.x + plat.width) {
                            this.currentPlatform = plat;
                            this.y = plat.y - 42;
                            return;
                        }
                    }
                }
                // 如果没找到平台，设为null让它自由落体
                if (this.y < H) {
                    this.currentPlatform = null;
                }
            }
            
            slip() {
                if (this.dead) return;
                this.slipping = true;
                this.slipDir = -this.dir;
                this.stunned = 600;
            }
            
            takeDamage(dmg) {
                if (this.dead) return;
                
                this.hp -= dmg;
                this.stunned = 280;
                this.x += (Math.random() > 0.5 ? 1 : -1) * 18;
                this.checkPlatform();
                
                for (let i = 0; i < 3; i++) {
                    game.drops.push({x:this.x,y:this.y,vx:(Math.random()-0.5)*6,vy:-Math.random()*5,emoji:['💥','⭐','💫'][i],life:20});
                }
                
                if (this.hp <= 0) this.die();
            }
            
            die() {
                this.dead = true;
                addScore(this.pts);
                addCombo();
                
                // 掉落
                if (Math.random() > 0.6) {
                    const types = ['coffee','energy','shield','magnet'];
                    game.drops.push({x:this.x,y:this.y,vx:(Math.random()-0.5)*4,vy:-3,type:types[Math.floor(Math.random()*types.length)],life:180});
                }
                
                // 爆炸
                for (let i = 0; i < 6; i++) {
                    game.drops.push({x:this.x,y:this.y,vx:(Math.random()-0.5)*10,vy:-Math.random()*7,emoji:this.emoji,life:30});
                }
                
                // Boss击败
                if (this.isBoss) {
                    if (game.bossPhase < 3) {
                        game.bossPhase++;
                        this.maxHp += 3;
                        this.hp = this.maxHp;
                        this.dead = false;
                        showEffectHint('⚠️ BOSS进入下阶段!');
                    } else {
                        game.enemies = [];
                        levelWin();
                    }
                }
            }
            
            draw() {
                if (this.dead || !this.currentPlatform) return;
                
                const sy = this.y - game.cameraY;
                if (sy > H + 50 || sy < -50) return;
                
                ctx.save();
                if (this.stunned > 0) ctx.globalAlpha = 0.6;
                if (this.isBoss) { ctx.shadowColor = this.color; ctx.shadowBlur = 10; }
                
                ctx.font = (this.isBoss ? 50 : 38) + 'px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'bottom';
                ctx.fillText(this.emoji, this.x, sy);
                
                // 血条
                if (this.maxHp > 1) {
                    const bw = this.isBoss ? 45 : 28;
                    ctx.fillStyle = 'rgba(0,0,0,0.5)';
                    ctx.fillRect(this.x - bw/2, sy - 38, bw, 4);
                    ctx.fillStyle = this.hp / this.maxHp > 0.5 ? '#4ecca3' : '#e94560';
                    ctx.fillRect(this.x - bw/2, sy - 38, bw * (this.hp / this.maxHp), 4);
                }
                
                ctx.restore();
            }
        }
        
        // ==================== 道具 ====================
        class Item {
            constructor(cfg) {
                const c = ITEM_CFG[cfg.t];
                this.type = cfg.t;
                this.emoji = c.e;
                this.name = c.name;
                this.platIdx = cfg.p;
                this.pos = cfg.pos || 0.5;
                this.collected = false;
                this.x = 0;
                this.y = 0;
            }
            
            spawn() {
                const plat = game.platforms[this.platIdx];
                if (!plat) return;
                this.x = plat.x + plat.width * this.pos;
                this.y = plat.y - 32;
                this.collected = false;
            }
            
            draw() {
                if (this.collected) return;
                
                const sy = this.y - game.cameraY;
                if (sy > H + 25 || sy < -25) return;
                
                const bounce = Math.sin(Date.now() / 280) * 2;
                
                ctx.font = '26px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'bottom';
                ctx.fillText(this.emoji, this.x, sy + bounce);
            }
            
            collect() {
                if (this.collected) return;
                this.collected = true;
                
                if (this.type === 'key') {
                    game.hasKey = true;
                    showEffectHint('🔑 获得钥匙!');
                    if (game.exitPortal) game.exitPortal.activate();
                } else {
                    for (let i = 0; i < 3; i++) {
                        if (!game.inventory[i]) {
                            game.inventory[i] = this.type;
                            updateItemBar();
                            showEffectHint(this.emoji + ' ' + this.name + '!');
                            return;
                        }
                    }
                }
            }
        }
        
        // ==================== 游戏函数 ====================
        function getLevel() { return LEVELS.find(l => l.id === game.currentLevel); }
        
        function getTheme() {
            const lv = getLevel();
            if (!lv) return THEMES.office;
            return THEMES[lv.theme] || THEMES.office;
        }
        
        function addScore(pts) {
            const mult = game.combo > 5 ? 2 : game.combo > 10 ? 3 : 1;
            game.score += pts * mult;
            showPopup('+' + pts * mult, game.player.x, game.player.y - game.cameraY - 35, 'scorePopup');
            updateUI();
        }
        
        function addCombo() {
            game.combo++;
            if (game.combo > game.maxCombo) game.maxCombo = game.combo;
            if (game.combo > 2) showPopup(game.combo + '连击!', game.player.x, game.player.y - game.cameraY - 55, 'comboPopup');
            game.energy = Math.min(CONFIG.ENERGY_MAX, game.energy + CONFIG.ENERGY_PER_HIT);
            updateUI();
            clearTimeout(game.comboTimer);
            game.comboTimer = setTimeout(() => { game.combo = 0; updateUI(); }, CONFIG.COMBO_TIMEOUT);
        }
        
        function showPopup(text, x, y, cls) {
            const div = document.createElement('div');
            div.className = cls;
            div.textContent = text;
            div.style.left = x + 'px';
            div.style.top = y + 'px';
            document.getElementById('gameContainer').appendChild(div);
            setTimeout(() => div.remove(), 500);
        }
        
        function showEffectHint(text) {
            const h = document.getElementById('tutorial');
            h.textContent = text;
            h.style.background = 'rgba(78,204,163,0.9)';
            h.style.display = 'block';
            setTimeout(() => { h.style.background = 'rgba(0,0,0,0.8)'; h.style.display = 'none'; }, 1000);
        }
        
        function updateUI() {
            document.getElementById('levelDisplay').textContent = game.currentLevel;
            document.getElementById('scoreDisplay').textContent = game.score;
            document.getElementById('comboDisplay').textContent = game.combo;
            document.getElementById('livesDisplay').textContent = game.lives;
            document.getElementById('starsDisplay').textContent = game.stars;
            document.getElementById('energyFill').style.height = game.energy + '%';
        }
        
        function updateItemBar() {
            for (let i = 0; i < 3; i++) {
                const slot = document.getElementById('item' + (i + 1));
                slot.textContent = game.inventory[i] ? ITEM_CFG[game.inventory[i]].e : '';
                slot.classList.toggle('active', game.inventory[i] !== null);
            }
        }
        
        // ==================== 关卡逻辑 ====================
        function startLevel() {
            const lv = getLevel();
            if (!lv) return;
            
            game.state = 'playing';
            game.timeLeft = lv.time;
            game.hasKey = false;
            game.bossPhase = 1;
            game.lives = 3;
            game.combo = 0;
            game.energy = 0;
            game.cameraY = 0;
            game.currentTheme = THEMES[lv.theme] || THEMES.office;
            game.activeEffects = {speed:0,invincible:0,shield:0,magnet:0};
            game.inventory = [null,null,null];
            game.enemies = [];
            game.platforms = [];
            game.items = [];
            game.drops = [];
            game.exitPortal = null;
            
            // 创建平台
            lv.platforms.forEach((p, i) => game.platforms.push(new Platform(p, i)));
            
            // 创建敌人
            lv.enemies.forEach(e => game.enemies.push(new Enemy(e)));
            
            // 创建道具
            lv.items.forEach(i => game.items.push(new Item(i)));
            
            setTimeout(() => {
                game.enemies.forEach(e => e.spawn());
                game.items.forEach(i => i.spawn());
                
                // 传送门
                const exitPlat = game.platforms[lv.exit.p];
                const portalX = exitPlat.x + exitPlat.width * lv.exit.pos;
                const portalY = exitPlat.y - 35;
                game.exitPortal = new Portal(portalX, portalY);
                
                // 创建玩家并放置到平台
                game.player = new Player();
                game.player.spawn();
            }, 100);
            
            updateUI();
            updateItemBar();
            document.getElementById('taskText').textContent = lv.task || '找钥匙→传送门!';
            document.getElementById('startScreen').style.display = 'none';
            document.getElementById('endScreen').classList.remove('show');
            
            game.timeTimer = setInterval(() => {
                if (game.state !== 'playing') return;
                game.timeLeft -= 0.1;
                Object.keys(game.activeEffects).forEach(k => { if (game.activeEffects[k] > 0) game.activeEffects[k] -= 100; });
                if (game.timeLeft <= 0) levelLose();
                updateUI();
            }, 100);
        }
        
        function checkExit() {
            if (!game.hasKey || !game.exitPortal) return;
            
            const p = game.player;
            const dx = Math.abs(p.x - game.exitPortal.x);
            const dy = Math.abs(p.y - game.exitPortal.y);
            
            if (dx < 35 && dy < 45) levelWin();
        }
        
        function levelWin() {
            game.state = 'win';
            clearInterval(game.timeTimer);
            
            let earned = 1;
            if (game.lives >= 2) earned = 2;
            if (game.lives >= 3 && game.timeLeft > 10) earned = 3;
            game.stars += earned;
            
            const next = game.currentLevel + 1;
            if (next <= LEVELS.length && !game.unlocks.includes(next)) game.unlocks.push(next);
            saveProgress();
            
            const stories = {1:'冲出办公室!',2:'茶水间狼藉!',3:'主管被你击败!',4:'会议室恶作剧!',5:'打印机大战!',6:'经理认输!',7:'电梯逃脱!',8:'冲破安保!',9:'CEO跪地!',10:'天台风景!',11:'董事会投降!',12:'终极胜利!'};
            
            document.getElementById('endTitle').textContent = '🎉 过关!';
            document.getElementById('endStory').textContent = stories[game.currentLevel] || '太棒了!';
            document.getElementById('starsEarned').textContent = '⭐'.repeat(earned) + '☆'.repeat(3-earned);
            document.getElementById('finalScore').textContent = game.score;
            document.getElementById('maxCombo').textContent = game.maxCombo;
            document.getElementById('endScreen').className = 'win show';
        }
        
        function levelLose() {
            game.state = 'lose';
            clearInterval(game.timeTimer);
            
            document.getElementById('endTitle').textContent = '💨 失败!';
            document.getElementById('endStory').textContent = '被' + (game.enemies.find(e => !e.dead)?.name || '老板') + '抓住了...';
            document.getElementById('starsEarned').textContent = '☆☆☆';
            document.getElementById('finalScore').textContent = game.score;
            document.getElementById('maxCombo').textContent = game.maxCombo;
            document.getElementById('endScreen').className = 'lose show';
        }
        
        function saveProgress() { localStorage.setItem('bossRunnerPlat_prog', JSON.stringify({unlocks:game.unlocks,stars:game.stars})); }
        function loadProgress() { const s = localStorage.getItem('bossRunnerPlat_prog'); if (s) { const d = JSON.parse(s); game.unlocks = d.unlocks || [1]; game.stars = d.stars || 0; } }
        function resetProgress() { if (confirm('重置进度?')) { game.unlocks = [1]; game.stars = 0; saveProgress(); showLevelSelector(); } }
        
        function showLevelSelector() {
            const c = document.getElementById('levelSelector');
            c.innerHTML = '';
            LEVELS.forEach(lv => {
                const btn = document.createElement('div');
                btn.className = 'levelBtn';
                if (game.unlocks.includes(lv.id)) btn.classList.add('unlocked');
                if (game.currentLevel === lv.id) btn.classList.add('current');
                if (!game.unlocks.includes(lv.id)) btn.classList.add('locked');
                if (lv.boss) btn.classList.add('boss');
                btn.innerHTML = `<span class="level-num">${lv.id}</span><span>${lv.boss?'👔':'▶'}</span>`;
                btn.onclick = () => { if (game.unlocks.includes(lv.id)) { game.currentLevel = lv.id; showLevelSelector(); } };
                c.appendChild(btn);
            });
        }
        
        // ==================== 游戏循环 ====================
        function gameLoop() {
            if (game.state !== 'playing') { requestAnimationFrame(gameLoop); return; }
            
            const theme = game.currentTheme || THEMES.office;
            
            // 背景渐变
            const bgGrad = ctx.createLinearGradient(0, 0, 0, H);
            bgGrad.addColorStop(0, theme.bg[0]);
            bgGrad.addColorStop(1, theme.bg[1]);
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, W, H);
            
            // 背景星星
            ctx.fillStyle = 'rgba(255,255,255,0.08)';
            for (let i = 0; i < 25; i++) {
                const x = (i * 131) % W;
                const y = ((i * 83) - game.cameraY * 0.1) % H;
                ctx.fillRect(x, y, 2, 2);
            }
            
            // 绘制平台
            game.platforms.forEach(p => p.draw(theme));
            
            // 传送门
            if (game.exitPortal) game.exitPortal.draw();
            
            // 道具
            game.items.forEach(i => i.draw());
            
            // 掉落物
            game.drops.forEach(d => {
                d.x += d.vx || 0;
                d.y += d.vy || 0;
                if (d.vy !== undefined) d.vy += 0.2;
                d.life--;
                
                const sy = d.y - game.cameraY;
                ctx.globalAlpha = Math.min(1, d.life / 30);
                ctx.font = d.type ? '22px Arial' : '18px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(d.type ? ITEM_CFG[d.type].e : d.emoji, d.x, sy);
                ctx.globalAlpha = 1;
                
                if (d.type && Math.abs(d.x - game.player.x) < 28 && Math.abs(d.y - game.player.y) < 32) {
                    for (let i = 0; i < 3; i++) {
                        if (!game.inventory[i]) {
                            game.inventory[i] = d.type;
                            updateItemBar();
                            showEffectHint(ITEM_CFG[d.type].e + ' ' + ITEM_CFG[d.type].n + '!');
                            d.life = 0;
                            break;
                        }
                    }
                }
            });
            game.drops = game.drops.filter(d => d.life > 0);
            
            // 玩家
            game.player.update();
            game.player.draw();
            
            // 敌人
            game.enemies.forEach(e => { e.update(); e.draw(); });
            
            checkExit();
            
            requestAnimationFrame(gameLoop);
        }
        
        // ==================== 控制 ====================
        const joystickArea = document.getElementById('joystickArea');
        const joystick = document.getElementById('joystick');
        let joystickActive = false;
        
        joystickArea.addEventListener('touchstart', e => { e.preventDefault(); joystickActive = true; });
        joystickArea.addEventListener('touchmove', e => {
            e.preventDefault();
            if (!joystickActive || !game.player) return;
            
            const rect = joystickArea.getBoundingClientRect();
            const cx = rect.left + rect.width/2;
            const cy = rect.top + rect.height/2;
            const dx = e.touches[0].clientX - cx;
            const dy = e.touches[0].clientY - cy;
            const dist = Math.min(Math.sqrt(dx*dx+dy*dy), 36);
            const angle = Math.atan2(dy, dx);
            
            joystick.style.transform = `translate(calc(-50% + ${Math.cos(angle)*dist}px), calc(-50% + ${Math.sin(angle)*dist}px))`;
            
            let speed = CONFIG.MOVE_SPEED;
            if (game.activeEffects.speed > 0) speed *= 1.8;
            
            game.player.velX = (Math.cos(angle) * dist / 36) * speed;
        });
        joystickArea.addEventListener('touchend', e => {
            e.preventDefault();
            joystickActive = false;
            joystick.style.transform = 'translate(-50%, -50%)';
            if (game.player) game.player.velX = 0;
        });
        
        document.getElementById('jumpBtn').addEventListener('touchstart', e => { e.preventDefault(); if (game.player && game.state === 'playing') game.player.jump(); });
        document.getElementById('slideBtn').addEventListener('touchstart', e => { e.preventDefault(); if (game.player && game.state === 'playing') { if (game.player.onGround) game.player.slide(); else game.player.dropDown(); } });
        document.getElementById('attackBtn').addEventListener('touchstart', e => { e.preventDefault(); if (game.player && game.state === 'playing') game.player.attack(); });
        document.getElementById('skillBtn').addEventListener('touchstart', e => {
            e.preventDefault();
            if (game.state === 'playing' && game.energy >= CONFIG.ENERGY_MAX) {
                game.energy = 0;
                showEffectHint('💥 蛋糕炸弹!');
                game.enemies.forEach(enemy => enemy.takeDamage(2));
                updateUI();
            }
        });
        
        for (let i = 0; i < 3; i++) {
            document.getElementById('item' + (i + 1)).addEventListener('click', () => { if (game.player && game.state === 'playing') game.player.useItem(i); });
        }
        
        document.getElementById('pauseBtn').addEventListener('click', () => { if (game.state === 'playing') { game.state = 'paused'; document.getElementById('pauseScreen').style.display = 'flex'; } });
        document.getElementById('resumeBtn').addEventListener('click', () => { game.state = 'playing'; document.getElementById('pauseScreen').style.display = 'none'; });
        document.getElementById('quitBtn').addEventListener('click', () => { game.state = 'menu'; clearInterval(game.timeTimer); document.getElementById('pauseScreen').style.display = 'none'; document.getElementById('startScreen').style.display = 'flex'; showLevelSelector(); });
        document.getElementById('startBtn').addEventListener('click', startLevel);
        document.getElementById('retryBtn').addEventListener('click', startLevel);
        document.getElementById('menuBtn').addEventListener('click', () => { game.state = 'menu'; document.getElementById('endScreen').classList.remove('show'); document.getElementById('startScreen').style.display = 'flex'; showLevelSelector(); });
        document.getElementById('resetBtn').addEventListener('click', resetProgress);
        document.getElementById('adBtn').addEventListener('click', () => { showEffectHint('📺 广告中...'); setTimeout(() => { game.score *= 2; showEffectHint('✅ x2分数!'); updateUI(); }, 1500); });
        
        loadProgress();
        showLevelSelector();
        
        const s = document.createElement('style');
        s.textContent = '@keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }';
        document.head.appendChild(s);
        
        gameLoop();
    </script>
</body>
</html>
